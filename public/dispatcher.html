<!DOCTYPE html>
<html>
<head>
    <title>The Dispatcher</title>
    <style>body { background: #000; color: #0f0; padding: 20px; font-family: monospace; }</style>
</head>
<body>
    <h1>[ THE DISPATCHER ]</h1>
    <input type="text" id="flightInput" placeholder="Enter Flight Number">
    <button onclick="launch()">LAUNCH</button>
    <div id="output"></div>
    <script>
        async function launch() {
            const val = document.getElementById('flightInput').value;
            const res = await fetch('/api/dispatcher-logic', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: val })
            });
            const data = await res.json();
            document.getElementById('output').innerText = data.report;
        }
    </script>
</body>
</html>
